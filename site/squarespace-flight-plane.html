<style>
  .fg-sky { position: relative; overflow: hidden; height: 220px; border-radius: 20px;
    background: linear-gradient(170deg, #16243b 0%, #2c3f63 55%, #4a6a8f 100%); }
  .fg-cloud { position: absolute; height: 18px; border-radius: 18px; background: rgba(255,255,255,0.10);
    animation: fg-drift linear infinite; }
  .fg-cloud::before { content: ""; position: absolute; left: 22%; top: -10px; width: 40%; height: 22px; border-radius: 50%; background: inherit; }
  .fg-c1 { top: 40px; width: 120px; animation-duration: 38s; animation-delay: -6s; }
  .fg-c2 { top: 120px; width: 170px; animation-duration: 52s; animation-delay: -30s; }
  .fg-c3 { top: 170px; width: 90px; animation-duration: 44s; animation-delay: -18s; }
  .fg-track { position: absolute; inset: 0; animation: fg-cross 16s linear infinite; }
  .fg-plane { position: absolute; left: 0; top: 70px; width: 220px; animation: fg-bob 4s ease-in-out infinite; }
  .fg-trail { position: absolute; top: 112px; right: 100%; width: 60vw; max-width: 600px; margin-right: -12px;
    border-top: 2px dashed rgba(255,255,255,0.25); }
  .fg-board { position: absolute; left: 24px; bottom: 20px; right: 24px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .fg-board p { margin: 0; color: #f2b544; font: 600 13px/1.3 ui-monospace, Menlo, monospace; letter-spacing: 0.14em; }
  .fg-board a { background: #e07a5f; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 999px;
    font: 700 15px/1 system-ui, sans-serif; }
  @keyframes fg-cross { from { transform: translateX(-240px); } to { transform: translateX(100%); } }
  @keyframes fg-bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
  @keyframes fg-drift { from { left: 100%; } to { left: -200px; } }
  @media (prefers-reduced-motion: reduce) {
    .fg-track, .fg-plane, .fg-cloud { animation: none; }
    .fg-track { transform: translateX(30%); }
  }
</style>

<div style="font-family: Arial, Helvetica, sans-serif; max-width: 440px; margin: 0 auto; padding: 24px 16px; color: #1b2433;">
  <p style="margin: 0 0 24px; letter-spacing: 0.3em; font-weight: bold; color: #16243b;">&#9992; FLIGHT</p>
  <h2 style="margin: 0 0 12px; color: #16243b;">Ready for boarding</h2>
  <p style="margin: 0 0 12px; line-height: 1.5;">Type this code in FLIGHT to sign in:</p>
  <p style="margin: 0 0 24px; font-size: 32px; letter-spacing: 0.3em; font-weight: bold; background: #dceaf5; color: #16243b; padding: 14px; border-radius: 10px; text-align: center;">{{ .Token }}</p>
  <p style="margin: 0 0 24px; line-height: 1.5;">Playing in a browser? You can <a href="{{ .ConfirmationURL }}" style="color: #e07a5f; font-weight: bold;">tap here to sign in</a> instead.</p>
  <p style="margin: 0 0 8px; color: #6b7486; font-size: 13px; line-height: 1.5;">The code and link work once and expire in an hour.</p>
  <p style="margin: 0; color: #6b7486; font-size: 13px; line-height: 1.5;">If you didn't ask to sign in, you can ignore this email.</p>
</div>
